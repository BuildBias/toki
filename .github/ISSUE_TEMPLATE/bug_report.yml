name: Bug report
description: Report something in Toki that doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can so we can reproduce it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The prompt you gave Claude and what it did step by step (for example, where it placed a file or whether the skill was invoked at all).
      placeholder: |
        1. Run `claude` in a project with ...
        2. Ask "..."
        3. Claude creates the file in ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant transcript or output
      description: Paste the relevant part of the Claude Code transcript or terminal output. It is rendered as code, so no backticks are needed.
      render: shell

  - type: input
    id: toki-version
    attributes:
      label: Toki version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "e.g. Opus, Sonnet"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
